<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boda Stefany & Noelia - Nuestra Boda</title>
    <!-- Fuentes de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #5a7b5a; /* Verde Salvia */
            --primary-dark: #445e44;
            --accent: #d4af37; /* Dorado */
            --bg-cream: #fbf9f5;
            --text-dark: #2c3e2d;
            --white: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas de pétalos flotantes */
        #petals-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        /* Reproductor de música flotante */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: var(--white);
            border: 2px solid var(--accent);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .music-player:hover {
            transform: scale(1.1);
        }

        .music-player i {
            color: var(--primary);
            font-size: 1.2rem;
        }

        /* Cabecera / Hero Section */
        header {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            background: linear-gradient(rgba(44, 62, 45, 0.35), rgba(44, 62, 45, 0.35)), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            color: var(--white);
        }

        .hero-content {
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem 2rem;
            border-radius: 15px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-content h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            color: var(--text-dark);
            line-height: 1.1;
            margin: 10px 0;
        }

        .names span {
            font-size: 2.5rem;
            color: var(--accent);
            display: block;
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        .date-location {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text-dark);
            margin: 1.5rem 0;
            font-weight: 600;
        }

        /* Cuenta Atrás */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 2rem 0;
        }

        .countdown-box {
            background: var(--bg-cream);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(90, 123, 90, 0.3);
            min-width: 70px;
        }

        .countdown-box span {
            display: block;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .countdown-box label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #666;
        }

        /* Secciones Generales */
        section {
            padding: 5rem 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .section-subtitle {
            text-align: center;
            font-style: italic;
            color: #666;
            margin-bottom: 3rem;
        }

        .divider {
            text-align: center;
            color: var(--accent);
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        /* Itinerario / Timeline */
        .timeline {
            position: relative;
            max-width: 700px;
            margin: 0 auto;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 2px;
            background-color: var(--primary);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -1px;
        }

        .timeline-item {
            padding: 10px 40px;
            position: relative;
            background-color: inherit;
            width: 50%;
        }
